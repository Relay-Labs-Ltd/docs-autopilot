<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 72" width="640" height="72" role="img" aria-label="Docs Autopilot by Relay Labs">
  <!-- Product lockup, Blue on Paper (the default colourway). The mark is the supplied
       Relay Labs geometry (two bars at 19.7°, right bar dropped a quarter) — never
       redrawn. Name in Helvetica Neue Bold, sentence case, ending in a full stop;
       the turn lands on "Autopilot." in Relay Blue. -->
  <g fill="#204EEA" transform="translate(0 14) scale(0.44)">
    <polygon points="29,0 55,0 26,81 0,81"/>
    <polygon points="65,19 90,19 61,100 35,100"/>
  </g>
  <text x="60" y="50" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-weight="700" font-size="40" letter-spacing="-1.4" fill="#17201B">Docs <tspan fill="#204EEA">Autopilot.</tspan></text>
  <text x="640" y="47" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" letter-spacing="1.6" fill="#6A7169">BY RELAY LABS</text>
</svg>
