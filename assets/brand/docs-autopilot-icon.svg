<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Docs Autopilot">
  <!-- App icon / marketplace avatar. Same composition as the business-card front:
       Paper on Blue, tint bars at 8% bleeding off the right edge, mark top-left,
       one word bottom-left. Everything decorative comes out of the mark. -->
  <rect width="512" height="512" fill="#204EEA"/>
  <g fill="#FAFAF8" fill-opacity="0.08" transform="translate(300 88) scale(3.4)">
    <polygon points="29,0 55,0 26,81 0,81"/>
    <polygon points="65,19 90,19 61,100 35,100"/>
  </g>
  <g fill="#FAFAF8" transform="translate(64 64) scale(1.6)">
    <polygon points="29,0 55,0 26,81 0,81"/>
    <polygon points="65,19 90,19 61,100 35,100"/>
  </g>
  <text x="60" y="446" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-weight="700" font-size="104" letter-spacing="-4.7" fill="#FAFAF8">Docs.</text>
</svg>
